<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Totem - Boteco do MK</title>
    <!-- Anti-cache ativado (v8) -->
    <link rel="stylesheet" href="style.css?v=8">
</head>
<body>

    <!-- Ecrã Inicial Escuro -->
    <div id="splash-screen">
        <img src="logo.png" alt="Logo Boteco do MK" style="width: 200px; margin-bottom: 20px; border-radius: 20px;">
        <h1>Bem-vindo ao Boteco do MK!</h1>
        <p style="font-size: 1.1rem; margin-bottom: 30px; color: #888;">Toque para iniciar o seu pedido</p>
        
        <input type="text" id="cliente-nome" placeholder="O seu Nome (Opcional)">
        <select id="cliente-consumo">
            <option value="Comer no Local">🍽️ Comer no Local</option>
            <option value="Levar">🛍️ Levar para Casa</option>
        </select>
        
        <button onclick="fecharSplashScreen()">INICIAR PEDIDO</button>
    </div>

    <!-- Fundo escuro quando o carrinho abre no mobile -->
    <div id="carrinho-overlay" class="carrinho-overlay" onclick="fecharCarrinho()"></div>

    <div class="container">
        <!-- Parte Central: Menu -->
        <main>
            <header>
                <h1>Cardápio</h1>
                <!-- Categorias com Scroll Horizontal -->
                <div class="categorias" id="categorias-container">
                    <button class="btn-categoria active">Todos</button>
                </div>
            </header>

            <div class="produtos-grid" id="produtos-grid">
                <!-- Produtos -->
            </div>
        </main>

        <!-- Carrinho (Desktop: Fixo | Mobile: Aba Retrátil) -->
        <aside class="carrinho" id="carrinho">
            <div class="carrinho-header">
                <h2>O Seu Pedido</h2>
                <!-- Botão de fechar (Só aparece no mobile) -->
                <button class="btn-fechar-carrinho" onclick="fecharCarrinho()">✖</button>
            </div>
            
            <div class="carrinho-itens" id="carrinho-itens">
                <p style="text-align: center; color: #888; margin-top: 50px;">O seu carrinho está vazio.</p>
            </div>

            <div class="carrinho-footer">
                <div class="total-area">
                    <span>Total</span>
                    <span class="valor-total">R$ <span id="total">0.00</span></span>
                </div>
                <button class="btn-finalizar" onclick="abrirModalPagamento()">FINALIZAR PEDIDO</button>
                <button class="btn-cancelar-pedido" onclick="cancelarPedidoTotem()">❌ Cancelar Pedido</button>
            </div>
        </aside>
    </div>

    <!-- Botão Flutuante (Exclusivo Mobile) -->
    <button class="btn-flutuante" id="btn-flutuante" onclick="abrirCarrinho()">
        🛒 Ver Pedido (<span id="qtd-flutuante">0</span>)
    </button>

    <!-- Modal de Ingredientes (Escuro) -->
    <div class="modal-overlay" id="modal-ingredientes">
        <div class="modal-content">
            <div class="modal-img-col">
                <img id="modal-img" src="" alt="Produto">
            </div>
            <div class="modal-info-col">
                <h2 id="modal-nome">Nome</h2>
                <p id="modal-preco">R$ 0.00</p>
                
                <h3 style="margin-bottom:10px;">Remover Ingredientes:</h3>
                <div class="lista-ingredientes" id="lista-ingredientes">
                </div>

                <div class="modal-botoes">
                    <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
                    <button class="btn-adicionar" onclick="adicionarAoCarrinho()">Adicionar ✅</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Pagamento -->
    <div class="modal-overlay" id="modal-pagamento">
        <div class="modal-content" style="flex-direction: column; align-items: center; text-align: center; padding: 40px; width: 90%; max-width: 400px;">
            <h2>Como deseja pagar?</h2>
            <div style="display: flex; gap: 20px; margin-top: 30px; width: 100%; justify-content: center; flex-wrap: wrap;">
                <button onclick="processarPagamento('PAGAR_NO_CAIXA')" style="flex:1; padding: 20px; font-size: 1.1rem; background: #3498db; color: white; border: none; border-radius: 15px; cursor: pointer; font-weight: bold;">
                    💵 Pagar no Caixa
                </button>
            </div>
            <button onclick="fecharModalPagamento()" style="margin-top: 25px; background: transparent; border: none; color: #888; cursor: pointer; font-size: 1.1rem; text-decoration: underline;">Voltar</button>
        </div>
    </div>

    <script src="app.js?v=8"></script>
</body>
</html>
