<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <!-- A regra de ouro para ecrãs mobile: -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Totem - Boteco do MK</title>
    <!-- O ?v=6 obriga o telemóvel a limpar o Cache! -->
    <link rel="stylesheet" href="style.css?v=6">
</head>
<body>

    <!-- Ecrã de Boas-Vindas (Splash Screen) -->
    <div id="splash-screen">
        <img src="logo.png" alt="Logo Boteco do MK" style="width: 250px; margin-bottom: 20px; border-radius: 20px;">
        <h1>Bem-vindo ao Boteco do MK!</h1>
        <p style="font-size: 1.2rem; margin-bottom: 30px;">Toque na tela para iniciar o seu pedido</p>
        
        <input type="text" id="cliente-nome" placeholder="O seu Nome (Opcional)">
        <select id="cliente-consumo">
            <option value="Comer no Local">🍽️ Comer no Local</option>
            <option value="Levar">🛍️ Levar para Casa</option>
        </select>
        
        <button onclick="fecharSplashScreen()">INICIAR PEDIDO</button>
    </div>

    <div class="container">
        <!-- Parte Central: Menu de Produtos -->
        <main>
            <header>
                <h1>Cardápio</h1>
                <div class="categorias" id="categorias-container">
                    <button class="btn-categoria active">Todos</button>
                    <!-- Categorias geradas por JS -->
                </div>
            </header>

            <div class="produtos-grid" id="produtos-grid">
                <!-- Produtos gerados por JS -->
            </div>
        </main>

        <!-- Parte Direita: Carrinho (No mobile, vai para o fundo!) -->
        <aside class="carrinho" id="carrinho">
            <div class="carrinho-header">
                <h2>O Seu Pedido</h2>
            </div>
            
            <div class="carrinho-itens" id="carrinho-itens">
                <!-- Itens adicionados aparecem aqui -->
                <p style="text-align: center; color: #7f8c8d; margin-top: 50px;">O seu carrinho está vazio.</p>
            </div>

            <div class="carrinho-footer">
                <div class="total-area">
                    <span>Total</span>
                    <span class="valor-total">R$ <span id="total">0.00</span></span>
                </div>
                <button class="btn-finalizar" onclick="abrirModalPagamento()">FINALIZAR PEDIDO</button>
                <button class="btn-cancelar-pedido" onclick="cancelarPedidoTotem()">❌ Cancelar Pedido</button>
            </div>
        </aside>
    </div>

    <!-- NOVO: Botão Flutuante Exclusivo para Mobile -->
    <a href="#carrinho" class="btn-flutuante" id="btn-flutuante">
        🛒 Ver Carrinho (<span id="qtd-flutuante">0</span>)
    </a>

    <!-- Modal de Ingredientes -->
    <div class="modal-overlay" id="modal-ingredientes">
        <div class="modal-content">
            <div class="modal-img-col">
                <img id="modal-img" src="" alt="Produto">
            </div>
            <div class="modal-info-col">
                <h2 id="modal-nome">Nome</h2>
                <p id="modal-preco">R$ 0.00</p>
                
                <h3>Remover Ingredientes:</h3>
                <div class="lista-ingredientes" id="lista-ingredientes">
                    <!-- Checkboxes de ingredientes -->
                </div>

                <div class="modal-botoes">
                    <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
                    <button class="btn-adicionar" onclick="adicionarAoCarrinho()">Adicionar ✅</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Pagamento -->
    <div class="modal-overlay" id="modal-pagamento">
        <div class="modal-content" style="flex-direction: column; align-items: center; text-align: center; padding: 40px;">
            <h2>Como deseja pagar?</h2>
            <div style="display: flex; gap: 20px; margin-top: 30px; width: 100%; justify-content: center; flex-wrap: wrap;">
                <button onclick="processarPagamento('PAGAR_NO_CAIXA')" style="flex:1; min-width:200px; padding: 25px; font-size: 1.2rem; background: #3498db; color: white; border: none; border-radius: 15px; cursor: pointer; font-weight: bold;">
                    💵 Pagar no Caixa
                </button>
            </div>
            <button onclick="fecharModalPagamento()" style="margin-top: 20px; background: transparent; border: none; color: #7f8c8d; cursor: pointer; font-size: 1.1rem; text-decoration: underline;">Voltar</button>
        </div>
    </div>

    <!-- Modal de Sucesso -->
    <div class="modal-overlay" id="modal-sucesso-overlay" style="z-index: 2000;">
        <div class="modal-content" id="modal-sucesso">
            <div class="icone-sucesso">✅</div>
            <h2>Adicionado!</h2>
        </div>
    </div>

    <script src="app.js?v=6"></script>
</body>
</html>
